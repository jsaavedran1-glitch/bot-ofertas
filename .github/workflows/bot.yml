name: Ojo al Precio - detector de ofertas

on:
  schedule:
    - cron: "*/30 * * * *"
      timezone: "America/Bogota"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de ejecución"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - review
          - automatic

permissions:
  contents: read

concurrency:
  group: facebook-deals-publisher
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
      ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      META_GRAPH_API_VERSION: "v26.0"
      POST_MODE: "review"
      MIN_DISCOUNT_PCT: "20"
      MIN_SAVINGS_COP: "20000"
      # 9 posts con foto + 3 reels (cuentan aquí) + 1 promo del día = 13 al día, cada una con su historia
      MAX_POSTS_PER_DAY: "12"
      # 50 y no 60: absorbe los minutos de retraso con que arranca cada ejecución
      MIN_MINUTES_BETWEEN_POSTS: "50"
      MAX_POSTS_PER_RUN: "1"
      # Una publicación por hora: 7:00-13:00 y 17:00-22:00 (13 franjas)
      PUBLISH_HOURS: "7-14,17-23"
      LINK_IN_COMMENT: "true"
      REEL_HOURS: "8,13,20"
      STORIES: "true"
      PROMO_HOURS: "12"
      REPOST_COOLDOWN_DAYS: "7"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install --requirement requirements.txt

      - name: Instalar fuente de emojis
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Validar base persistente
        shell: bash
        run: |
          if [[ "$DATABASE_URL" != postgresql://* && "$DATABASE_URL" != postgres://* ]]; then
            echo "DATABASE_URL debe apuntar a PostgreSQL/Supabase en GitHub Actions"
            exit 1
          fi

      - name: Ejecutar bot
        shell: bash
        env:
          REQUESTED_MODE: ${{ github.event_name == 'schedule' && 'automatic' || github.event.inputs.mode || 'review' }}
        run: |
          case "$REQUESTED_MODE" in
            automatic) python main.py run --automatic ;;
            dry-run)   python main.py run --dry-run ;;
            review)    python main.py scan ;;
            *) echo "Modo no válido: $REQUESTED_MODE"; exit 2 ;;
          esac
