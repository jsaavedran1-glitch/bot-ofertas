name: Ojo al Precio - detector de ofertas

on:
  schedule:
    - cron: "*/30 * * * *"
      timezone: "America/Bogota"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de ejecución"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - review
          - automatic
          - ai-preview
          - informe
          - cupones
          - exportar
          - colores
          - historial
          - permisos

permissions:
  contents: read
  issues: write  # the weekly report is opened as an issue (GitHub emails it to you)

concurrency:
  group: facebook-deals-publisher
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # Las publicaciones de cada ejecución se reparten en su media hora
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
      ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
      ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
      ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
      TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      # Canal de Telegram (opcional): sin estos secrets no se publica allí
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Claude Sonnet 5.5 (opcional): títulos en español, textos y revisión de la imagen. Sin el secret, plantillas.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Feed de Adidas CO en Awin. APAGADO hasta que Awin apruebe la afiliación (hoy: pendiente). Para
      # activarlo, reemplaza "" por ${{ secrets.AWIN_ADIDAS_FEED_URL }} (el secret ya está guardado).
      AWIN_ADIDAS_FEED_URL: ""
      # Claude en las publicaciones (textos + revisión visual). "false" lo apaga sin borrar la clave.
      AI_ENABLED: "true"
      META_GRAPH_API_VERSION: "v26.0"
      POST_MODE: "review"
      MIN_DISCOUNT_PCT: "35"
      MIN_SAVINGS_COP: "20000"
      # Publicaciones por hora (Bogotá), unas 63 al día. Volumen de Club de los gratis a la mitad, pero cargado
      # al día: allá 9-17h promedió 10,2 reacciones por post y 17-24h solo 1,8 (63 de 80 posts sin ninguna).
      # 8h: 3 · 9-16h: 34 · 17-22h: 26. Cada ejecución (cada 30 min) hace su mitad de la hora, espaciadas.
      POSTS_PER_HOUR: "8:3,9:5,10:4,11:4,12:5,13:4,14:4,15:4,16:4,17:5,18:5,19:5,20:4,21:4,22:3"
      # Dato útil o noticia (alternados) como primera publicación de estas horas; allá fueron lo más comentado
      CONTENT_HOURS: "9,12,17"
      # "¿Descuento real?": historial de 30 días de una oferta con nuestros propios datos y su veredicto (real,
      # buen precio o "antes" inflado). Reemplaza una oferta de esa hora; si ninguna tiene historial suficiente,
      # sale una oferta normal. Contenido original, el que Meta recomienda.
      HISTORY_HOURS: "11,16,20"
      # Revisión diaria del precio de las ofertas recientes (una consulta por producto y día) para que tengan
      # historial continuo aunque no aparezcan en los listados de ofertas de la tienda.
      TRACK_PER_RUN: "30"
      # Copia en Instagram (@ojoalprecioco, vinculada a la página): todos los reels y, de las publicaciones con
      # foto (ofertas, datos útiles, noticias, cupones, promo, cuenta regresiva, "¿Descuento real?"), las primeras
      # INSTAGRAM_PHOTOS_PER_HOUR de cada hora (~15 al día). Instagram permite 100 publicaciones por API al día.
      INSTAGRAM_KINDS: "reel,historial,oferta,dato,noticia,cupones,promo,evento"
      INSTAGRAM_PHOTOS_PER_HOUR: "1"
      # Tope de seguridad diario (la suma de arriba es 63; con EVENT_BOOST, ~82)
      MAX_POSTS_PER_DAY: "90"
      # Black Friday (27-29 nov) y Cyber Monday (30 nov): 30 % más publicaciones por hora, etiqueta y hashtags
      # del evento. Del 20 al 26 de nov, cuenta regresiva a las 8 h (app/events.py).
      EVENT_BOOST: "1.3"
      # Separación mínima entre publicaciones de ejecuciones seguidas
      MIN_MINUTES_BETWEEN_POSTS: "4"
      LINK_IN_COMMENT: "true"
      # 6 reels al día: la primera publicación de cada una de estas horas es un reel
      REEL_HOURS: "8,10,13,15,19,21"
      # Historias: TODAS las publicaciones (ofertas, reels, promo, Top 5, datos, noticias, cuenta regresiva y
      # cupones) también van a la historia de la página, ~63 al día (~82 con EVENT_BOOST). Para limitarlas, baja
      # STORIES_PER_HOUR a cuántas por hora (1 = solo la primera de cada hora).
      STORIES: "true"
      STORIES_PER_HOUR: "99"
      PROMO_HOURS: "12"
      # Carrusel "Top 5 ofertas de hoy" (cuenta como una de las publicaciones de esa hora)
      TOP_HOURS: "18"
      # Tendencias del Centro de inspiración de Facebook (Panel profesional). Actualizar cada semana.
      TRENDING_TAGS: "BlackFriday,BlackFridayColombia,CyberMonday,Navidad,regalosdenavidad,descuento,ahorro"
      REPOST_COOLDOWN_DAYS: "7"
      # Color de marca de cada tienda, leído de su página principal (etiqueta theme-color o ícono del sitio)
      STORE_COLOR_LOOKUP: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install --requirement requirements.txt

      - name: Instalar fuente de emojis
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-color-emoji ffmpeg

      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -v

      - name: Validar base persistente
        shell: bash
        run: |
          if [[ "$DATABASE_URL" != postgresql://* && "$DATABASE_URL" != postgres://* ]]; then
            echo "DATABASE_URL debe apuntar a PostgreSQL/Supabase en GitHub Actions"
            exit 1
          fi

      - name: Ejecutar bot
        shell: bash
        env:
          REQUESTED_MODE: ${{ github.event_name == 'schedule' && 'automatic' || github.event.inputs.mode || 'review' }}
        run: |
          case "$REQUESTED_MODE" in
            automatic) python main.py run --automatic ;;
            dry-run)   python main.py run --dry-run ;;
            review)    python main.py scan ;;
            ai-preview) python main.py ai-preview --limit 12 ;;
            informe)   python main.py informe --collect --save --diario ;;
            cupones)   python main.py cupones ;;
            exportar)  python main.py exportar --days 30 ;;
            historial) python main.py historial --dry-run ;;
            permisos)  python main.py permisos ;;
            colores)   python -c "from app.store_colors import store_color as c; [print('COLOR', s, c(s, u)) for s, u in (('alkosto','https://www.alkosto.com/x'),('ktronix','https://www.ktronix.com/x'),('exito','https://www.exito.com/x'),('falabella','https://www.falabella.com.co/x'),('nike','https://www.nike.com.co/x'),('tennis','https://www.tennis.com.co/x'),('amazon','https://www.amazon.com/x'),('mercadolibre','https://www.mercadolibre.com.co/x'))]" ;;
            *) echo "Modo no válido: $REQUESTED_MODE"; exit 2 ;;
          esac

      - name: Mostrar exportación de estadísticas
        if: success() && hashFiles('generated/estadisticas.json') != ''
        # Una línea JSON por bloque y por publicación, con el prefijo EXP, para leerla desde el registro
        run: |
          python -c "
          import json
          d = json.load(open('generated/estadisticas.json', encoding='utf-8'))
          for k, v in d.items():
              if k == 'posts':
                  for p in v: print('EXP\tpost\t' + json.dumps(p, ensure_ascii=False, default=str))
              else:
                  print('EXP\t' + k + '\t' + json.dumps(v, ensure_ascii=False, default=str))
          "

      - name: Guardar exportación de estadísticas
        if: success() && hashFiles('generated/estadisticas.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: estadisticas
          path: generated/estadisticas.json
          retention-days: 2

      - name: Publicar informe diario
        if: success() && hashFiles('generated/informe_diario.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Un solo issue abierto "Informe diario" con un comentario por día (GitHub te avisa por correo).
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "Informe diario in:title" \
                --json number,title --jq '[.[] | select(.title | startswith("Informe diario"))][0].number // empty')
          if [ -z "$n" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "Informe diario · Ojo al Precio" \
              --body-file generated/informe_diario.md
          else
            gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file generated/informe_diario.md
          fi

      - name: Publicar informe semanal
        if: success() && hashFiles('generated/informe_semanal.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Informe semanal Ojo al Precio · $(TZ=America/Bogota date +%F)" \
            --body-file generated/informe_semanal.md
